openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API for Usagi Art Order
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: packages
  - name: orders
  - name: admin
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201": { description: Account created }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: Email already exists }
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200": { description: Session created }
        "401": { description: Invalid credentials }
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "204": { description: Session cleared }
  /auth/me:
    get:
      operationId: currentUser
      tags: [auth]
      responses:
        "200":
          description: Current account or null
  /packages:
    get:
      operationId: listPackages
      tags: [packages]
      responses:
        "200":
          description: Available packages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Package"
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Orders owned by the account }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createOrder
      tags: [orders]
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderInput"
      responses:
        "201": { description: Order created }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Account is not approved }
        "409": { description: Package is closed or full }
  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200": { description: Order details }
        "404": { description: Order not found }
  /admin/users:
    get:
      operationId: listUsersForAdmin
      tags: [admin]
      security: [{ sessionCookie: [] }]
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/AccountStatus"
      responses:
        "200": { description: Accounts }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/users/{id}:
    patch:
      operationId: decideUser
      tags: [admin]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDecision"
      responses:
        "200": { description: Updated account }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      tags: [admin]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: "#/components/schemas/OrderStatus"
      responses:
        "200": { description: Updated order }
        "403": { $ref: "#/components/responses/Forbidden" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: usagi_session
  parameters:
    OrderId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    UserId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Invalid request
    Unauthorized:
      description: Authentication required
    Forbidden:
      description: Administrator access required
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    RegisterInput:
      type: object
      required: [fullName, email, password, passwordConfirm]
      properties:
        fullName: { type: string, minLength: 2 }
        className: { type: string }
        contact: { type: string }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        passwordConfirm: { type: string, minLength: 8 }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    Package:
      type: object
      required: [id, name, price, maximumOrders, currentOrders, isOpen]
      properties:
        id: { type: integer }
        name: { type: string }
        price: { type: integer }
        maximumOrders: { type: integer }
        currentOrders: { type: integer }
        isOpen: { type: boolean }
    CreateOrderInput:
      type: object
      required: [packageId, subject, artType, style, size, colors, description]
      properties:
        packageId: { type: integer }
        subject: { type: string }
        artType: { type: string }
        style: { type: string }
        size: { type: string }
        colors: { type: string }
        description: { type: string }
        purpose: { type: string }
        addText: { type: boolean }
        addedText: { type: string }
        imageKeys:
          type: array
          items: { type: string }
    AccountStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]
    AccountDecision:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/AccountStatus"
        adminNote: { type: string }
    OrderStatus:
      type: string
      enum: [PENDING, ACCEPTED, DRAWING, COMPLETED, REJECTED]