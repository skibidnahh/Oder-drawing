name: 🔌 Deploy Backend to Vercel

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy-backend:
    name: 🚀 Deploy Backend to Vercel
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ✅ TypeScript check
        run: pnpm run typecheck:libs
        continue-on-error: true

      - name: 🏗️ Build backend (api-server)
        run: pnpm --filter @workspace/api-server run build
        env:
          NODE_ENV: production

      - name: 🗄️ Run database migrations
        if: github.ref == 'refs/heads/main'
        run: pnpm --filter @workspace/db run push
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        continue-on-error: true

      - name: 🚀 Deploy to Vercel (Production)
        if: github.ref == 'refs/heads/main'
        uses: vercel/action@v5
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          scope: ${{ secrets.VERCEL_ORG_ID }}
          production: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          APP_ORIGIN: ${{ secrets.APP_ORIGIN }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          NSFW_FILTER_ENABLED: ${{ secrets.NSFW_FILTER_ENABLED || 'true' }}
          NSFW_MODEL: giacomoarienti/nsfw-classifier
          NSFW_BLOCKED_LABELS: porn,hentai
          NSFW_BLOCK_THRESHOLD: '0.6'
          NSFW_FAIL_OPEN: 'true'
          UPLOAD_DIR: uploads
          NODE_ENV: production
          PORT: 3001

      - name: 🚀 Deploy to Vercel (Preview - develop branch)
        if: github.ref == 'refs/heads/develop'
        uses: vercel/action@v5
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          scope: ${{ secrets.VERCEL_ORG_ID }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          APP_ORIGIN: ${{ secrets.APP_ORIGIN }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          NSFW_FILTER_ENABLED: ${{ secrets.NSFW_FILTER_ENABLED || 'true' }}
          NODE_ENV: production

      - name: ✅ Backend deployment complete
        run: |
          echo "✅ Backend deployed to Vercel!"
          echo "🔗 Check Vercel dashboard for deployment details"
          echo "🌐 API: ${{ secrets.APP_ORIGIN }}"
